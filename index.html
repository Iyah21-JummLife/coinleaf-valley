<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coinleaf Valley</title>
<meta name="description" content="A cozy pixel village that grows when you save. Track pay, bills, loans and pay-later plans, and get a daily money letter.">
<meta name="theme-color" content="#8fd16a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coinleaf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one column. A pixel village window on top, then a stat row, action buttons, a pill tab bar and soft outlined cards. Max 900px.
   Look: "modern pixel" = rounded cards with a crisp 2px outline and a hard offset shadow, pixel display type, clean spacing. */
:root{
  --bg:#eef6e8; --bg-dot:#d3e6c7;
  --parch:#fffdf8; --parch-2:#f3f6ee; --wood:#26302b; --wood-2:#cfd8c8; --shadow:rgba(38,48,43,.18); --input:#ffffff;
  --ink:#1f2a24; --ink-soft:#5f6e66;
  --gold:#ffcc4d; --gold-ink:#3d2c00; --leaf:#22a45d; --sea:#3d7bff; --berry:#f0436a; --amber:#f08c00; --rose:#e85d9f;
  --font-display:"Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --font-label:"Silkscreen", "Pixelify Sans", ui-monospace, monospace;
  --font-body:"Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --font-num:"Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151f; --bg-dot:#1f2433;
  --parch:#1c2130; --parch-2:#252b3d; --wood:#05070c; --wood-2:#343b52; --shadow:rgba(0,0,0,.5); --input:#151926;
  --ink:#eef1f7; --ink-soft:#a2aac0;
  --gold:#ffd25e; --gold-ink:#2e2100; --leaf:#43d17f; --sea:#7aa4ff; --berry:#ff6b8a; --amber:#ffae3d; --rose:#ff86bd;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151f; --bg-dot:#1f2433;
  --parch:#1c2130; --parch-2:#252b3d; --wood:#05070c; --wood-2:#343b52; --shadow:rgba(0,0,0,.5); --input:#151926;
  --ink:#eef1f7; --ink-soft:#a2aac0;
  --gold:#ffd25e; --gold-ink:#2e2100; --leaf:#43d17f; --sea:#7aa4ff; --berry:#ff6b8a; --amber:#ffae3d; --rose:#ff86bd;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
:root.clear{--font-body:"Nunito", "Segoe UI", system-ui, sans-serif; --font-num:"Nunito", "Segoe UI", system-ui, sans-serif; --font-display:"Pixelify Sans", "Trebuchet MS", system-ui, sans-serif}
:root.clear h1{font-size:22px} :root.clear h2{font-size:18px} :root.clear h3{font-size:15px}
:root.clear .stat .lab,:root.clear th,:root.clear .cal .dow,:root.clear .q .xp,:root.clear .portrait span,:root.clear .tab,:root.clear .lvl .badge{font-size:13px;letter-spacing:.03em}
:root.clear .num,:root.clear .item .amt,:root.clear td.n{font-weight:800}
:root.clear .float{font-family:var(--font-display);font-size:clamp(11px,2vw,16px)}
.fontbtn{font-family:var(--font-display);font-size:12px;min-height:36px;padding:6px 10px}
body{background-color:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.45;
  background-image:linear-gradient(45deg,var(--bg-dot) 25%,transparent 25%,transparent 75%,var(--bg-dot) 75%),linear-gradient(45deg,var(--bg-dot) 25%,transparent 25%,transparent 75%,var(--bg-dot) 75%);
  background-size:16px 16px;background-position:0 0,8px 8px;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.5}
h1{font-size:15px}
h2{font-size:12px;letter-spacing:.02em}
h3{font-size:10px;letter-spacing:.04em}
p{margin:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.02em}
.muted{color:var(--ink-soft)}
.frame{background:var(--parch);border:3px solid var(--wood);box-shadow:inset 0 0 0 2px var(--wood-2),inset 0 0 0 5px var(--parch-2),0 4px 0 var(--shadow)}
.pad{padding:18px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand canvas{width:36px;height:42px;image-rendering:pixelated}
.brand .sub{font-size:14px;color:var(--ink-soft)}
.lvl{display:flex;align-items:center;gap:8px;background:var(--parch);border:3px solid var(--wood);padding:6px 10px;box-shadow:0 3px 0 var(--shadow)}
.lvl .badge{font-family:var(--font-display);font-size:9px;background:var(--gold);color:var(--gold-ink);padding:4px 6px}
.lvl .bar{width:90px;height:8px;background:var(--parch-2);border:2px solid var(--wood)}
.lvl .bar i{display:block;height:100%;background:var(--leaf)}
.lvl small{font-size:13px;color:var(--ink-soft)}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;background:var(--gold);color:var(--gold-ink);border:3px solid var(--wood);font-weight:600}

/* village */
.village{padding:8px}
.stage{position:relative;width:100%;aspect-ratio:4/3;max-width:min(100%,760px);margin:0 auto;overflow:hidden;background:#6cbc3c}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#signs,#floats{position:absolute;inset:0;pointer-events:none}
.sign{position:absolute;transform:translate(-50%,-100%);background:#fff4d2;color:#3b2414;border:2px solid #74391a;font-size:clamp(9px,1.6vw,13px);line-height:1.1;padding:2px 4px;white-space:nowrap;max-width:22%;overflow:hidden;text-overflow:ellipsis;font-weight:600;pointer-events:auto;cursor:pointer}
.sign.home{background:#ffc933}
.float{position:absolute;transform:translate(-50%,-100%);font-family:var(--font-display);font-size:clamp(8px,1.5vw,12px);color:#fff;text-shadow:2px 0 #3b2414,-2px 0 #3b2414,0 2px #3b2414,0 -2px #3b2414;animation:rise 1.6s steps(16) forwards;white-space:nowrap}
.float.bad{color:#ffb3bf}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-34px}}
.themes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 6px 2px;font-size:14px;color:var(--ink-soft)}
.chip.on{background:var(--wood);color:var(--parch);border-color:var(--wood)}
.legend{font-size:14px;color:var(--ink-soft);padding:8px 6px 2px}

/* hud */
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .lab{font-family:var(--font-display);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.stat .num{font-size:27px;line-height:1.1}
.stat small{font-size:13px;color:var(--ink-soft)}
.meter{height:8px;background:var(--parch-2);border:2px solid var(--wood);margin-top:4px}
.meter i{display:block;height:100%;background:var(--leaf)}
.good{color:var(--leaf)} .warn{color:var(--amber)} .bad{color:var(--berry)}

/* buttons */
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:820px){.actions{grid-template-columns:repeat(3,1fr)}}
@media (max-width:620px){.actions{grid-template-columns:repeat(2,1fr)}.actions > :last-child{grid-column:1/-1}}
.btn{font-family:var(--font-body);font-weight:700;font-size:16px;color:var(--ink);background:var(--parch);border:3px solid var(--wood);box-shadow:inset 0 -4px 0 var(--parch-2),0 3px 0 var(--wood);padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 var(--parch-2),0 0 0 var(--wood)}
.btn:focus-visible,.icon-btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,.day:focus-visible,.chip:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.btn.gold{background:var(--gold);color:var(--gold-ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),0 3px 0 var(--wood)}
.btn.green{background:var(--leaf);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 3px 0 var(--wood)}
.btn.small{font-size:14px;min-height:36px;padding:6px 10px}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn .ico{width:18px;height:18px;image-rendering:pixelated}
.icon-btn{background:transparent;border:2px solid var(--wood);color:var(--ink);font-family:var(--font-body);font-weight:700;width:34px;height:34px;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--parch-2)}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-family:var(--font-display);font-size:9px;letter-spacing:.04em;padding:10px 12px;background:var(--parch-2);color:var(--ink);border:3px solid var(--wood);border-bottom-width:0;cursor:pointer;opacity:.85}
.tab[aria-selected="true"]{background:var(--parch);opacity:1;transform:translateY(3px)}
#panel{display:flex;flex-direction:column;gap:14px}
.section{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}

/* Pip dialog */
.talk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.portrait{width:76px;display:flex;flex-direction:column;align-items:center;gap:4px}
.portrait canvas{width:72px;height:84px;image-rendering:pixelated;background:var(--parch-2);border:3px solid var(--wood)}
.portrait span{font-family:var(--font-display);font-size:8px;background:var(--wood);color:#fff4d2;padding:3px 6px}
.speech{font-size:19px;min-height:3em;max-width:62ch}
@media (max-width:480px){.talk{grid-template-columns:1fr}.portrait{flex-direction:row;width:auto}.portrait canvas{width:48px;height:56px}}
.questbar{display:flex;gap:4px;flex-wrap:wrap}
.questbar i{width:14px;height:14px;border:2px solid var(--wood);background:var(--parch-2)}
.questbar i.on{background:var(--leaf)}
.questbar i.now{background:var(--gold)}

/* forms */
label.fld{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--ink-soft);min-width:0;flex:1 1 140px}
label.fld.w2{flex:2 1 200px}
label.fld.w-s{flex:0 1 110px}
input,select,textarea{font-family:var(--font-body);font-size:17px;color:var(--ink);background:#fffaf0;border:2px solid var(--wood);padding:8px 9px;width:100%;min-width:0}
:root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea{background:#1e1b36}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) input,:root:not([data-theme="light"]) select,:root:not([data-theme="light"]) textarea{background:#1e1b36}}
.form-grid{display:flex;flex-wrap:wrap;gap:10px}
.le{display:flex;flex-direction:column;gap:10px}
.le-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:10px;border:2px dashed var(--wood-2);background:var(--parch-2)}
.le-empty{font-size:15px;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-body);font-size:14px;font-weight:600;padding:4px 9px;border:2px solid var(--wood);background:var(--parch);color:var(--ink);cursor:pointer}
.chip:hover{background:var(--gold);color:var(--gold-ink)}
.hint{font-size:14px;color:var(--ink-soft)}
.err{color:var(--berry);font-weight:600;font-size:15px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-family:var(--font-display);font-size:8px;text-align:center;color:var(--ink-soft);padding:4px 0}
.day{min-height:52px;border:2px solid var(--wood-2);background:var(--parch);padding:3px;display:flex;flex-direction:column;gap:3px;cursor:pointer;font-family:var(--font-num);font-size:15px;font-weight:600;color:var(--ink);text-align:left}
.day.out{visibility:hidden}
.day.today{border-color:var(--sea);border-width:3px}
.day.sel{background:var(--gold);color:var(--gold-ink)}
.dots{display:flex;flex-wrap:wrap;gap:2px}
.dot{width:8px;height:8px;display:block;border:1px solid rgba(0,0,0,.35)}
.t-pay{background:var(--leaf)} .t-bill{background:var(--amber)} .t-loan{background:var(--sea)} .t-bnpl{background:var(--rose)} .t-late{background:var(--berry)} .t-paid{background:transparent}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 10px;background:var(--parch-2);border:2px solid var(--wood-2)}
.item .when{font-family:var(--font-num);font-size:15px;font-weight:600;min-width:58px}
.item .name{font-weight:600;overflow-wrap:anywhere}
.item .name small{display:block;font-weight:400;color:var(--ink-soft);font-size:13px}
.item .amt{font-family:var(--font-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.item.paid{opacity:.6}
.tag{font-size:12px;font-weight:700;padding:1px 6px;border:2px solid currentColor;text-transform:uppercase;letter-spacing:.04em}
.keyrow{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--ink-soft)}
.keyrow span{display:inline-flex;align-items:center;gap:5px}

/* insights */
.alloc{display:flex;height:26px;border:3px solid var(--wood);background:var(--parch-2);overflow:hidden}
.alloc i{display:block;height:100%}
.alloc-key{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;font-size:15px}
.alloc-key div{display:flex;align-items:center;gap:6px}
.alloc-key b{margin-left:auto;font-family:var(--font-num);font-size:17px;font-weight:600}
.c-need{background:var(--amber)} .c-want{background:var(--rose)} .c-loan{background:var(--sea)} .c-bnpl{background:#a46bd6} .c-inv{background:#2bb3a3} .c-left{background:var(--leaf)}
.tips{display:flex;flex-direction:column;gap:8px}
.tip{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding:10px 12px;background:var(--parch-2);border:2px solid var(--wood-2)}
.tip i{width:14px;height:14px;margin-top:5px;display:block}
.tip.s-good i{background:var(--leaf)} .tip.s-warn i{background:var(--amber)} .tip.s-bad i{background:var(--berry)} .tip.s-info i{background:var(--sea)}
.persona{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.persona canvas{width:84px;height:84px;image-rendering:pixelated;background:var(--parch-2);border:3px solid var(--wood)}
.persona .kind{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--leaf)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.split .stat{border:2px solid var(--wood-2);background:var(--parch-2)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
th,td{text-align:left;padding:7px 8px;border-bottom:2px dashed var(--wood-2)}
th{font-family:var(--font-display);font-size:8px;color:var(--ink-soft);letter-spacing:.05em}
td.n{font-family:var(--font-num);font-size:16px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
th.n{text-align:right}
.cats{display:flex;flex-direction:column;gap:6px}
.cat{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:15px}
.cat .b{height:12px;background:var(--parch-2);border:2px solid var(--wood)}
.cat .b i{display:block;height:100%;background:var(--amber)}
.cat b{font-family:var(--font-num);font-size:16px;font-weight:600}

/* quests */
.qlist{display:flex;flex-direction:column;gap:8px}
.q{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;background:var(--parch-2);border:2px solid var(--wood-2)}
.q .box{width:22px;height:22px;border:3px solid var(--wood);background:var(--parch)}
.q.done .box{background:var(--leaf)}
.q.done .t{text-decoration:line-through;text-decoration-thickness:2px}
.q .xp{font-family:var(--font-display);font-size:8px;color:var(--amber)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bdg{display:flex;gap:8px;align-items:center;padding:8px;border:2px solid var(--wood-2);background:var(--parch-2);font-size:14px}
.bdg canvas{width:32px;height:32px;image-rendering:pixelated;flex:none}
.bdg.locked{opacity:.45;filter:grayscale(1)}
.bdg b{display:block;font-size:15px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(20,10,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .dialog{width:min(520px,100%);max-height:calc(100% - 20px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);border:3px solid var(--wood);padding:10px 16px;font-weight:700;z-index:60;box-shadow:0 4px 0 var(--shadow);max-width:calc(100% - 32px)}
.bonus{background:var(--gold);color:var(--gold-ink);border:3px dashed var(--wood);padding:12px;display:flex;flex-direction:column;gap:10px}
.bonus label.fld{color:var(--gold-ink)}
.bonus h3{font-size:11px}
.foot{font-size:13px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
@media (prefers-reduced-motion: reduce){.float{animation-duration:.01s}}

/* ---------- modern pixel layer ---------- */
body{background-image:radial-gradient(var(--bg-dot) 1.2px,transparent 1.6px);background-size:18px 18px;background-position:0 0;font-size:17px}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
.frame{border:2px solid var(--wood);border-radius:var(--r);box-shadow:4px 4px 0 var(--wood)}
.village{padding:10px}
.stage{border-radius:var(--r-sm);border:2px solid var(--wood)}
.stat .lab,th,.cal .dow,.q .xp,.lvl .badge,.portrait span,.tab{font-family:var(--font-label);letter-spacing:.04em}
.stat .lab{font-size:11px}
th{font-size:10px}
.cal .dow{font-size:10px}
.q .xp{font-size:10px}
.stat .num{font-size:30px}
.lvl{border:2px solid var(--wood);border-radius:999px;padding:5px 12px 5px 6px;box-shadow:3px 3px 0 var(--wood)}
.lvl .badge{border-radius:999px;font-size:10px;padding:5px 9px}
.lvl .bar{border-radius:999px;overflow:hidden;border-width:2px}
.banner{border:2px solid var(--wood);border-radius:var(--r);box-shadow:3px 3px 0 var(--wood)}
.btn{border:2px solid var(--wood);border-radius:var(--r-sm);box-shadow:3px 3px 0 var(--wood);font-weight:600;transition:transform .08s,box-shadow .08s}
.btn:hover{filter:none;transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--wood)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--wood)}
.btn.gold,.btn.green{box-shadow:3px 3px 0 var(--wood)}
.btn.ghost{box-shadow:none;border-style:dashed}
.btn.ghost:hover{box-shadow:none;transform:none;background:var(--parch-2)}
.icon-btn{border-radius:8px}
.tabs{gap:4px;padding:4px;background:var(--parch);border:2px solid var(--wood);border-radius:999px;width:max-content;max-width:100%;overflow-x:auto;box-shadow:3px 3px 0 var(--wood)}
.tab{border:0;border-radius:999px;background:transparent;font-size:11px;padding:9px 14px;opacity:1;color:var(--ink-soft);white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--parch-2)}
.tab[aria-selected="true"]{transform:none;background:var(--wood);color:var(--parch)}
input,select,textarea{border-radius:8px;border:2px solid var(--wood-2);background:var(--input)}
input:focus,select:focus,textarea:focus{border-color:var(--wood)}
:root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea{background:var(--input)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) input,:root:not([data-theme="light"]) select,:root:not([data-theme="light"]) textarea{background:var(--input)}}
.le-row{border-radius:var(--r-sm);border:2px dashed var(--wood-2)}

/* ---------- state ---------- */
const LS_KEY = "coinleaf-valley-v1";
function blank(){
  return { v:1, mode:"quest", step:0,
    profile:{ name:"", currency:"USD", payFreq:"semimonthly", payAmount:0, nextPayDate: today(), payDays:[15,30], source:"Salary (CBA)" },
    cash:0, banks:[], loans:[], bnpl:[], bills:[], investments:[], goal:{ name:"Emergency fund", amount:0, bank:"" },

function sample(){

let S = null;            // the person's own state
let SAMPLE = null;       // sample village (not saved)
let mode = "title";      // title | quest | sample | play
const V = () => (mode === "sample" || mode === "title") ? SAMPLE : S;

/* ---------- money + dates ---------- */
let fmtCache = {};
function fmt(n, cur){
  cur = cur || (V() && V().profile.currency) || "USD";
  const whole = Math.abs(n) >= 1000 || Number.isInteger(r2(n));
  const k = cur + whole;
  try { fmtCache[k] = fmtCache[k] || new Intl.NumberFormat(undefined, { style:"currency", currency:cur, minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 }); return fmtCache[k].format(n); }
  catch(e){ return cur + " " + (Math.round(n * 100) / 100).toLocaleString(); }
}
function amortized(bal, apr, months){
  bal = n0(bal); months = Math.max(1, n0(months) || 12); const r = n0(apr) / 1200;
  if (bal <= 0) return 0;
  if (r === 0) return bal / months;
  return r * bal / (1 - Math.pow(1 + r, -months));
}
const PPY = { monthly:12, biweekly:26, weekly:52, once:12 };
const ppy = l => PPY[l.freq] || 12;
function loanPmt(l){
  if (n0(l.payment) > 0) return n0(l.payment);
  if (l.freq === "once") return n0(l.balance);
  return amortized(l.balance, apr(l) * 12 / ppy(l), l.term);
}
function loanMonthly(l){
  if (n0(l.balance) <= 0) return 0;
  if (l.freq === "once"){ const m = l.nextDate ? Math.max(1, Math.ceil(diffDays(today(), l.nextDate) / 30.4)) : 1; return loanPmt(l) / m; }
  return loanPmt(l) * ppy(l) / 12;
}
function apr(l){ return l && l.rateUnit === "month" ? n0(l.rate) * 12 : n0(l && l.rate); }
const rateLabel = l => l.rateUnit === "month" ? `${n0(l.rate)}% a month` : `${n0(l.rate)}% a year`;
const loanRateP = l => l.freq === "once" ? 0 : apr(l) / 100 / ppy(l);
function loanDoneBy(l, n){
  if (l.freq === "once") return l.nextDate || null;
  if (!isFinite(n)) return null;
  if (!l.freq || l.freq === "monthly") return addMonths(today(), n);
  return addDays(l.nextDate || today(), (l.freq === "weekly" ? 7 : 14) * Math.max(0, n - 1));
}
function payoffMonths(bal, apr, pmt){
  bal = n0(bal); pmt = n0(pmt); const r = n0(apr) / 1200;
  if (bal <= 0) return 0; if (pmt <= 0) return Infinity;
  if (r === 0) return Math.ceil(bal / pmt);
  if (pmt <= bal * r) return Infinity;
  return Math.ceil(-Math.log(1 - r * bal / pmt) / Math.log(1 + r));
}
const isVar = b => b.plan === "varies";
const bnplLeft = b => isVar(b) ? (bnplActive(b) ? 1 : 0) : Math.max(0, n0(b.total) - n0(b.paidCount));

/* ---------- metrics + insights ---------- */
function metrics(st){

  const want = sum(st.bills.filter(b => b.need === "want"), b => n0(b.amount));

  const liquid = n0(st.cash) + sum(st.banks.filter(b => b.kind !== "savings"), b => n0(b.balance));
  const debt = sum(st.loans, l => Math.max(0, n0(l.balance))) + sum(st.bnpl, bnplOwed);

  const efMonths = essentials > 0 ? saved / essentials : null;

  const invested = sum(st.investments, i => n0(i.value));

  const perPay = f.perMonth ? suggestMonthly / f.perMonth : 0;
  const np = nextPayday(st);

  const owedBeforePay = sum(dueBeforePay, e => e.amount);

  const daysToPay = np ? Math.max(1, diffDays(today(), np)) : 14;
  const mStart = today().slice(0, 7);
  const spendMonth = st.log.filter(e => e.type === "spend" && e.date.slice(0, 7) === mStart);
  const byCat = {}; for (const e of spendMonth) byCat[e.category || "Other"] = (byCat[e.category || "Other"] || 0) + n0(e.amount);

}
function persona(M, st){
  st = st || V();

  if (M.leftover < 0) return { key:"tight", name:"The Tightrope Walker", text:"More is promised out each month than comes in. The first job is to close that gap so savings have room to grow." };
  if (M.activeBnpl.length >= 2) return { key:"juggler", name:"The Juggler", text:"Several pay-later plans are in the air at once. Each feels small, but together they quietly claim a slice of every paycheck." };
  if (M.dti != null && M.dti > 0.3) return { key:"climber", name:"The Climber", text:"Loans take a big share of your pay. You're climbing a hill, and every extra payment makes the next step lighter." };

let dbNs = null, uidCloud = null, docRef = null, profRef = null, saving = false, again = false, saveTimer = null, syncState = "device";

async function connectCloud(){

/* ---------- ledger ---------- */
function commit(e){
  const st = V();
  e.id = uid(); e.at = Date.now(); e.date = e.date || today(); e.deltas = e.deltas || [];
  for (const [k, d] of e.deltas) applyDelta(k, d, st);
  if (e.paidKey) st.paid[e.paidKey] = true;
  if (e.bnplId){ const b = st.bnpl.find(x => x.id === e.bnplId); if (b) b.paidCount = n0(b.paidCount) + 1; }
  const before = level(st.xp || 0).lvl;
  st.xp = (st.xp || 0) + (e.xp || 0);
  st.log.unshift(e); if (st.log.length > 800) st.log.length = 800;
  scheduleSave(); villageReact(e);
}
function undo(id){
  const st = V(); const i = st.log.findIndex(e => e.id === id); if (i < 0) return; const e = st.log[i];
  for (const [k, d] of e.deltas || []) applyDelta(k, -d, st);
  if (e.paidKey) delete st.paid[e.paidKey];
  if (e.addedLoan) st.loans = st.loans.filter(l => l.id !== e.addedLoan);
  if (e.billRef){ const b = st.bills.find(x => x.id === e.billRef); if (b){ b.actual = b.actual || {}; b.notes = b.notes || {}; if (e.prevActual == null) delete b.actual[e.ym]; else b.actual[e.ym] = e.prevActual; if (e.prevNote == null) delete b.notes[e.ym]; else b.notes[e.ym] = e.prevNote; } }
  if (e.bnplId){ const b = st.bnpl.find(x => x.id === e.bnplId); if (b) b.paidCount = Math.max(0, n0(b.paidCount) - 1); }
  st.xp = Math.max(0, (st.xp || 0) - (e.xp || 0));
  st.log.splice(i, 1); scheduleSave(); render(); toast("Undone. Balances are back to how they were.");
}

function recordActual(entry, billId, ym, amt, note, add){
  const b = V().bills.find(x => x.id === billId); if (!b) return;

const ymList = n => { const d = parse(today()); const out = []; for (let i = n - 1; i >= 0; i--) out.push(ymd(new Date(d.getFullYear(), d.getMonth() - i, 1)).slice(0, 7)); return out; };
function billHist(b, n = 6){

    if (a == null && n0(b.dueDay) > 0){ const [yy, mm] = ym.split("-").map(Number); if (st.paid["bill:" + b.id + ":" + onDay(yy, mm - 1, n0(b.dueDay))]) a = pl; }
    const tol = Math.max(1, pl * .02); const k = a == null ? (ym === cur ? "wait" : "none") : a > pl + tol ? "over" : a < pl - tol ? "under" : "on";
    return { ym, a, k, pre: ym < since && a == null };
  });
  const data = months.filter(m => m.a != null); const over = data.filter(m => m.k === "over").length, under = data.filter(m => m.k === "under").length, on = data.filter(m => m.k === "on").length;
  let label = "Tracking", cls = "soft";
  if (data.length >= 2){ if (on === data.length){ label = "Steady"; cls = "paid"; } else if (over >= data.length / 2){ label = "Often more"; cls = "late"; } else if (under >= data.length / 2){ label = "Often less"; cls = "due"; } else { label = "Mostly steady"; cls = "soft"; } }
  const last3 = data.slice(-3); let suggest = null;
  if (last3.length === 3 && (last3.every(m => m.k === "over") || last3.every(m => m.k === "under"))) suggest = nice(sum(last3, m => m.a) / 3);
  const mx = Math.max(pl, ...data.map(m => m.a), 1);
  const html = `<div class="hist" role="img" aria-label="Last ${n} months compared with the usual ${fmt(pl)}">${months.map(m => `<i class="${m.k}" style="height:${m.a != null ? Math.max(3, m.a / mx * 30).toFixed(1) : m.k === "wait" ? (pl / mx * 30).toFixed(1) : 3}px" title="${MONTHS[Number(m.ym.slice(5)) - 1]}: ${m.a != null ? fmt(m.a) : m.k === "wait" ? "not paid yet" : "no record"}"></i>`).join("")}<span class="pl" style="bottom:${(pl / mx * 30).toFixed(1)}px"></span></div><div class="hl" aria-hidden="true">${months.map(m => `<span>${MONTHS[Number(m.ym.slice(5)) - 1][0]}</span>`).join("")}</div>`;
  return { html, label, cls, suggest, over, under, on, n: data.length };
}

  const diffs = rows.filter(r => Math.abs(r.df) >= .01), sugg = rows.filter(r => r.H.suggest && Math.abs(r.H.suggest - n0(r.b.amount)) >= 1), steady = rows.filter(r => r.H.label === "Steady").length;

function weekQuests(st){
  const t = today(); const ws = addDays(t, -((new Date().getDay() + 6) % 7));
  const wk = st.log.filter(e => e.date >= ws);
  const spendDays = new Set(wk.filter(e => e.type === "spend").map(e => e.date));
  const elapsed = diffDays(ws, t) + 1;
  const paydayDates = new Set(wk.filter(e => e.type === "payday").map(e => e.date));
  return [
    { t:"Feed a savings building", d:"Move any amount into a savings account", xp:20, done: wk.some(e => e.type === "move" && e.toSavings) },
    { t:"Keep the diary", d:"Log your spending on 3 different days", xp:15, done: spendDays.size >= 3, prog: `${Math.min(3, spendDays.size)}/3` },
    { t:"Early bird", d:"Pay a bill before its due date", xp:15, done: wk.some(e => e.early) },
    { t:"Quiet pockets", d:"Have 2 no-spend days", xp:15, done: elapsed - spendDays.size >= 2 && wk.length > 0, prog: `${Math.max(0, Math.min(2, elapsed - spendDays.size))}/2` },
    { t:"Pay yourself first", d:"Move money to savings on a payday", xp:25, done: wk.some(e => e.type === "move" && e.toSavings && paydayDates.has(e.date)) },
  ];
}

let payChoices = [];
const EXTRA_KINDS = ["Overtime","Bonus","13th month pay","Holiday / night differential","Allowance","Other extra"];
function recommendExtra(extra, st){
  const M = metrics(st); let keep = 0; const why = [];
  if (M.safe < 0){ keep = Math.min(extra, -M.safe); why.push(`${fmt(keep)} stays in spending to cover bills due before your next payday`); }
  const rem = extra - keep;
  const hi = st.loans.filter(l => n0(l.balance) > 0 && l.freq !== "once").sort((a, b) => apr(b) - apr(a))[0];
  const hiOk = hi && apr(hi) >= 10;
  let save = 0, loan = 0;
  if (M.efMonths == null || M.efMonths < 1){ save = rem * (hiOk ? .6 : .8); loan = hiOk ? rem * .2 : 0; why.push("most of it goes to savings to build a 1-month cushion first"); }
  else if (hiOk){ loan = rem * .5; save = rem * .3; why.push(`half goes to ${hi.name || "your loan"} because its ${rateLabel(hi)} interest costs you the most`); }
  else if (M.efMonths < 3){ save = rem * .7; why.push("most of it goes to savings to grow your cushion toward 3 months"); }
  else { save = rem * .6; why.push("your cushion is strong, so more of it is yours to enjoy"); }
  loan = Math.min(loan, hi ? n0(hi.balance) : 0);
  save = Math.min(rem - loan, nice(save)); loan = nice(loan);
  if (save + loan > rem){ save = Math.max(0, r2(rem - loan)); }
  const parts = [];
  if (save > 0) parts.push(`${fmt(save)} to savings`); if (loan > 0) parts.push(`${fmt(loan)} to ${hi.name || "your loan"}`);
  const treat = Math.max(0, r2(rem - save - loan));
  const lead = why.length ? why[0].charAt(0).toUpperCase() + why[0].slice(1) + (why[1] ? ", and " + why[1] : "") + "." : "";
  return { keep, save: Math.max(0, save), loan: Math.max(0, loan), hi, text: `Pip's split: ${parts.join(" and ") || "keep it all"}. ${lead} ${treat > 0 ? `The other ${fmt(treat)} is your treat. You earned it!` : ""}` };
}
function renderExtra(){

    r[f.k] = (f.type === "number" || f.type === "day") ? n0(t.value) : t.value;
    if (key === "bnpl" && isVar(r)){
      if (f.k === "amount"){ const nd = nextVarDue(r); if (nd){ r.amounts = r.amounts || {}; r.amounts[nd.slice(0, 7)] = n0(t.value); } }
      if (f.k === "balance") r.balanceSet = true;
    }
    if (key === "loans" && f.k === "balance") r.orig = Math.max(n0(r.orig), n0(r.balance));
    scheduleSave();
  }
});

/* ---------- boot ---------- */
SAMPLE = sample();
try { const raw = ls.get(lsKeyFor(PID)) || (PID !== "main" ? null : null); if (raw){ S = normalize(JSON.parse(raw)); mode = S.mode === "play" ? "play" : "quest"; ensureProfileEntry(); } } catch(e){ S = null; }
render();
requestAnimationFrame(tick);
connectCloud();
aiInit();
})();
